<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4ef">
  <title>Get Together</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">gt</span> Get Together</div>
    <div class="topbar-actions">
      <button class="icon-action-button" id="newBillButton" type="button" aria-label="Start a new bill" title="Start a new bill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6M9 15h6"/></svg></button>
      <button class="icon-action-button" id="openButton" type="button" aria-label="Open a saved bill" title="Open a saved bill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg></button>
      <button class="icon-action-button" id="saveButton" type="button" aria-label="Save bill to this device" title="Save bill to this device"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4h12l3 3v13H5V4Z"/><path d="M8 4v5h7V4M8 14h8v6H8z"/></svg></button>
      <button class="icon-action-button" id="shareButton" type="button" aria-label="Create share link" title="Create share link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l2-2A5 5 0 0 0 12 3.93l-1.15 1.14M14 11a5 5 0 0 0-7.07 0l-2 2A5 5 0 0 0 12 20.07l1.15-1.14"/></svg></button>
    </div>
  </header>
  <main>
    <section class="family-settlement" aria-labelledby="familiesTitle">
      <div class="families-section">
        <div class="section-heading">
          <div><h2 id="familiesTitle">Who’s joining? <span class="count" id="familyCount"></span></h2></div>
          <button class="button button-secondary" id="addFamily" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Add family</button>
        </div>
        <div class="family-table-wrap">
          <table class="family-table">
            <thead><tr><th scope="col">Family head</th><th class="number" scope="col">Share</th><th class="number" scope="col">Paid</th><th class="number settlement-head" scope="col">Settlement</th><th class="family-action" scope="col"><span class="visually-hidden">Actions</span></th></tr></thead>
            <tbody id="familyList"></tbody>
            <tfoot><tr class="family-total-row">
              <th scope="row">Total</th>
              <td class="number"><strong id="grandTotal">₹0.00</strong></td>
              <td class="number"><strong id="paidTotal">₹0.00</strong></td>
              <td class="number"><div class="total-difference"><strong id="difference">₹0.00</strong></div></td>
              <td></td>
            </tr></tfoot>
          </table>
        </div>
        <p class="settlement-warning" id="settlementWarning" hidden></p>
      </div>
    </section>
    <div class="layout">
      <section aria-labelledby="expensesTitle">
        <div class="section-heading">
          <h2 id="expensesTitle">Expenses <span class="count" id="expenseCount"></span></h2>
          <button class="button" id="addExpense" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Add expense</button>
        </div>
        <div class="expenses" id="expenses"></div>
      </section>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog class="share-dialog" id="shareDialog" aria-labelledby="shareDialogTitle">
    <div class="share-dialog-head"><h2 id="shareDialogTitle">Share this bill</h2><button class="share-close" id="closeShareDialog" type="button" aria-label="Close">&times;</button></div>
    <p class="share-dialog-copy">The link shows the bill data in a readable format. Anyone with the link can view and edit their copy.</p>
    <div class="share-link-row"><input id="shareUrl" type="url" readonly aria-label="Share link"></div>
    <div class="share-actions">
      <button class="button button-secondary" id="copyShareUrl" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 9h10v10H9zM5 15V5h10"/></svg> Copy link</button>
      <button class="button" id="nativeShareUrl" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l2-2A5 5 0 0 0 12 3.93l-1.15 1.14M14 11a5 5 0 0 0-7.07 0l-2 2A5 5 0 0 0 12 20.07l1.15-1.14"/></svg> Share link</button>
    </div>
  </dialog>
  <dialog class="share-dialog" id="openDialog" aria-labelledby="openDialogTitle">
    <div class="share-dialog-head"><h2 id="openDialogTitle">Open a saved bill</h2><button class="share-close" id="closeOpenDialog" type="button" aria-label="Close">&times;</button></div>
    <p class="share-dialog-copy">Choose a bill saved on this device.</p>
    <div class="bill-list" id="billList"></div>
  </dialog>
  <dialog class="share-dialog" id="confirmDialog" aria-labelledby="confirmDialogTitle">
    <div class="share-dialog-head"><h2 id="confirmDialogTitle">Unsaved changes</h2><button class="share-close" id="closeConfirmDialog" type="button" aria-label="Close">&times;</button></div>
    <p class="share-dialog-copy" id="confirmDialogMessage"></p>
    <div class="share-actions">
      <button class="button button-secondary" id="confirmDiscard" type="button">Discard</button>
      <button class="button" id="confirmSave" type="button">Save &amp; continue</button>
    </div>
  </dialog>
  <script src="script.js"></script>
</body>
</html>
